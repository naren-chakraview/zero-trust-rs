# Example zt-gateway config with TLS + optional mTLS enabled. Run from the
# repo root:
#   cargo run --bin zt-gateway -- examples/gateway.mtls.config.yaml
#
# No cert_path/key_path are set anywhere below, so zt-gateway generates
# ephemeral server and CA certificates at startup (logged as warnings) --
# fine for trying this out, not for anything a real client should trust
# long-term. See docs/design/0001-tls-mtls-termination.md for how to point
# these at real, persistent certificate material instead.

listen_addr: 127.0.0.1:8443
upstream_addr: http://127.0.0.1:8080
registry_path: tests/fixtures/registry.yaml
protected_workload: spiffe://chakra.internal/ns/inventory/sa/inventory-svc
token_ttl_seconds: 300

tls:
  client_auth: optional   # none | optional | required

ca:
  ttl_seconds: 3600
