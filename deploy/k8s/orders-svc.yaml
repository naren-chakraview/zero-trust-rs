# orders-svc: the middle hop (api-gateway -> orders-svc -> inventory-svc).
# Same same-pod topology as inventory-svc.yaml.
#
# Task 14 (N13): see api-gateway.yaml's comment for the `listen_addr` ->
# `proxy_addr`/`admin_addr` split rationale and the shared `zt-ca` mTLS
# trust root -- identical here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zt-gateway-config-orders-svc
  namespace: zero-trust-demo
data:
  gateway.config.yaml: |
    proxy_addr: 0.0.0.0:443
    admin_addr: 127.0.0.1:6443
    upstream_addr: http://127.0.0.1:8080
    registry_path: /etc/zt-gateway/registry.yaml
    signing_key_path: /etc/zt-gateway/keys/signing-key.pem
    jwks_path: /etc/zt-gateway/jwks/public-jwks.json
    active_kid: orders-svc
    protected_workload: spiffe://chakra.internal/ns/orders/sa/orders-svc
    token_ttl_seconds: 300
    tls:
      client_auth: required
    ca:
      cert_path: /etc/zt-gateway/ca/ca-cert.pem
      key_path: /etc/zt-gateway/ca/ca-key.pem
      ttl_seconds: 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-svc
  namespace: zero-trust-demo
  labels:
    app: orders-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-svc
  template:
    metadata:
      labels:
        app: orders-svc
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:latest
          args:
            - -listen=127.0.0.1:8080
            - -text=hello from orders-svc

        - name: zt-gateway
          image: zero-trust/zt-gateway:dev
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: RUST_LOG
              value: info
            # Task 6 (F13 part 2): see api-gateway.yaml for the full
            # rationale/caveat (this env var is currently inert; SPIRE
            # opt-in is via gateway.config.yaml's spire_socket_path).
            - name: ZT_SPIRE_SOCKET_PATH
              value: "/tmp/spire-agent/agent.sock"
          args:
            - /etc/zt-gateway/gateway.config.yaml
          ports:
            # See api-gateway.yaml's comment: only proxy_addr is declared
            # (admin_addr is loopback-only and has no Service).
            - containerPort: 443
          volumeMounts:
            - name: registry
              mountPath: /etc/zt-gateway/registry.yaml
              subPath: registry.yaml
            - name: gateway-config
              mountPath: /etc/zt-gateway/gateway.config.yaml
              subPath: gateway.config.yaml
            - name: ca-material
              mountPath: /etc/zt-gateway/ca
              readOnly: true
            # Option 1 JWKS (review 0002 F4/N7): only this gateway's own private
            # key, never the other gateways'.
            - name: signing-key
              mountPath: /etc/zt-gateway/keys
              readOnly: true
            - name: jwks
              mountPath: /etc/zt-gateway/jwks
              readOnly: true
            - name: spire-agent-socket
              mountPath: /tmp/spire-agent
              readOnly: true
      volumes:
        - name: registry
          configMap:
            name: zt-registry
        - name: gateway-config
          configMap:
            name: zt-gateway-config-orders-svc
        - name: ca-material
          secret:
            secretName: zt-ca
        # Created by scripts/deploy-all.sh from deploy/k8s/keys/ (git-ignored).
        - name: signing-key
          secret:
            secretName: zt-signing-key-orders-svc
        # Public verification set, identical in all three gateways.
        - name: jwks
          configMap:
            name: zt-jwks
        - name: spire-agent-socket
          hostPath:
            path: /tmp/spire-agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: zero-trust-demo
spec:
  selector:
    app: orders-svc
  ports:
    - name: https
      port: 443
      targetPort: 443
