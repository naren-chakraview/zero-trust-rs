# Same shape/content as tests/fixtures/registry.yaml, shared by all three
# zt-gateway instances below. Bootstrap tokens in plaintext are fine for a
# local kind demo; not for anything real (see README's v0.1 identity
# limitations).
#
# Task 7 (F16) added the `client` workload entry below, needed so
# scripts/demo-obo-chain.sh can mint `client` its hop-0 bootstrap token.
#
# Task 14 (N13) fix: each OTHER workload's `allowed_callers` now lists only
# its own immediate caller, not the chain's originator. Before Task 2 (N1),
# `obo::validate` authorized `claims.sub`, which `token_exchange::
# exchange_token` never changes across hops -- so every hop's allow-list
# had to (wrongly) name the originating `client` identity, letting any hop
# borrow the originator's standing. Task 2 (N1, commit 33a27b4) changed
# `obo::validate` to authorize `obo::current_actor` (the outermost `act.sub`
# -- see obo.rs's module doc comment) instead, so each destination's
# `allowed_callers` must now name whoever calls *it* directly:
#   - api-gateway is called directly by `client` (hop 0, no `act` yet, so
#     current_actor == sub == client) -- unchanged.
#   - orders-svc is called by api-gateway (current_actor == api-gateway
#     after api-gateway's token-exchange) -- `client` removed; it would
#     never match current_actor on the real exchanged-token path and its
#     presence here was only ever a workaround for the pre-N1-fix bug.
#   - inventory-svc is called by orders-svc (current_actor == orders-svc
#     after orders-svc's token-exchange) -- `client` and `api-gateway`
#     removed, same reasoning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zt-registry
  namespace: zero-trust-demo
data:
  registry.yaml: |
    trust_domain: chakra.internal

    workloads:
      - name: client
        spiffe_id: spiffe://chakra.internal/ns/client/sa/client
        namespace: client
        service_account: client
        max_obo_chain_depth: 0
        allowed_callers: []
        bootstrap_token: client-dev-secret

      - name: api-gateway
        spiffe_id: spiffe://chakra.internal/ns/api-gateway/sa/api-gateway
        namespace: api-gateway
        service_account: api-gateway
        # R5 (review 0003): an exchange refuses a chain past this limit, counting the
        # hop it adds. api-gateway delegates once (client -> api-gateway), so 2.
        max_obo_chain_depth: 2
        allowed_callers:
          - spiffe://chakra.internal/ns/client/sa/client
        bootstrap_token: api-gateway-dev-secret

      - name: orders-svc
        spiffe_id: spiffe://chakra.internal/ns/orders/sa/orders-svc
        namespace: orders
        service_account: orders-svc
        max_obo_chain_depth: 3
        allowed_callers:
          - spiffe://chakra.internal/ns/api-gateway/sa/api-gateway
        bootstrap_token: orders-dev-secret

      - name: inventory-svc
        spiffe_id: spiffe://chakra.internal/ns/inventory/sa/inventory-svc
        namespace: inventory
        service_account: inventory-svc
        max_obo_chain_depth: 3
        allowed_callers:
          - spiffe://chakra.internal/ns/orders/sa/orders-svc
        bootstrap_token: inventory-dev-secret
