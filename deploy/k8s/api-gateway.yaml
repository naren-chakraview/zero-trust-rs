# api-gateway: the ingress hop (api-gateway -> orders-svc -> inventory-svc).
# max_obo_chain_depth: 2 for this workload (see registry-configmap.yaml). It's
# the entry point, and it delegates once, to orders-svc. A chain that starts
# at the client and passes through api-gateway is two entries long.
#
# Task 14 (N13): `listen_addr` (dead config -- see src/config.rs/F7+F10's
# admin/proxy listener split) replaced by the real `proxy_addr`/`admin_addr`
# pair the binary actually binds: `admin_addr` (issuance/authorize/
# token-exchange) stays loopback-only (127.0.0.1:6443), `proxy_addr`
# (protected-traffic forwarding) is the only one reachable off-pod
# (0.0.0.0:443). `tls.client_auth: required` + `ca.cert_path`/`key_path`
# (loaded from the zt-ca Secret, deploy/k8s/zt-ca-secret.yaml, shared by all
# three gateways so a cert issued by one is trusted by the others) enforce
# mTLS on both listeners -- see src/bin/zt-gateway.rs's single
# `tls_acceptor` shared across `build_admin_router`/`build_proxy_router`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zt-gateway-config-api-gateway
  namespace: zero-trust-demo
data:
  gateway.config.yaml: |
    proxy_addr: 0.0.0.0:443
    admin_addr: 127.0.0.1:6443
    upstream_addr: http://127.0.0.1:8080
    registry_path: /etc/zt-gateway/registry.yaml
    signing_key_path: /etc/zt-gateway/keys/signing-key.pem
    jwks_path: /etc/zt-gateway/jwks/public-jwks.json
    active_kid: api-gateway
    # F14 / demo (docs/demo-obo-chain.md): /demo on this gateway's proxy is
    # answered by the standalone demo backend, not the embedded sidecar.
    # The route's workload_id is the authorization destination, so it must
    # be this gateway's own identity, the audience of the token it receives.
    routes:
      - path_pattern: /demo
        workload_id: spiffe://chakra.internal/ns/api-gateway/sa/api-gateway
        upstream_addr: http://backend-a.zero-trust-demo.svc.cluster.local:8080
    # Agent demo (review 0003 R8): trust the mock IdP for edge-minted user tokens.
    user_issuers:
      - http://localhost:18500/default
    user_idps:
      - issuer: http://localhost:18500/default
        jwks_path: /etc/zt-gateway/idp/idp-jwks.json
        audience: zt-gateway
        principal_claim: email
    protected_workload: spiffe://chakra.internal/ns/api-gateway/sa/api-gateway
    token_ttl_seconds: 300
    # Demo only (docs/demo-obo-chain.md). With mTLS on, issuance binds tokens to
    # the caller's cert and refuses unbound ones. Each delegation hop then needs
    # the cert the token is bound to. But the gateway that receives a
    # client-bound token can't exchange it, because it doesn't hold the client's
    # key (review 0002, N2). This gateway issues the demo's hop-0 token unbound.
    # Design 0002 (docs/design/0002-delegation-with-bound-tokens.md) proposes
    # proxy-side re-minting, which would remove this setting.
    # Hops are still checked: every proxy call must come from the current actor
    # (N1), and the token's audience and depth are checked at each exchange.
    require_cert_binding: false
    tls:
      client_auth: required
    # R7 fix (review 0003): the only gateway holding the CA private key. It issues
    # X.509 SVIDs for the demo workloads (POST /v1/svid/x509). The others verify
    # only.
    ca:
      cert_path: /etc/zt-gateway/ca/ca-cert.pem
      key_path: /etc/zt-gateway/ca/ca-key.pem
      ttl_seconds: 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: zero-trust-demo
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:latest
          args:
            - -listen=127.0.0.1:8080
            - -text=hello from api-gateway

        - name: zt-gateway
          image: zero-trust/zt-gateway:dev
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: RUST_LOG
              value: info
            # Task 6 (F13 part 2): path to the Task 6 SPIRE agent's
            # Workload API socket (deploy/k8s/spire-agent.yaml), mounted
            # below via hostPath. NOTE: as of Task 5 (src/spire_provider.rs,
            # src/config.rs), the gateway binary reads `spire_socket_path`
            # only from gateway.config.yaml -- there is no
            # ZT_SPIRE_SOCKET_PATH / ZT_GATEWAY_SPIRE_SOCKET_PATH env-var
            # override wired up yet, so this var is currently inert. Set
            # `spire_socket_path: "unix:/tmp/spire-agent/agent.sock"` in
            # the ConfigMap above to actually opt this gateway into SPIRE.
            - name: ZT_SPIRE_SOCKET_PATH
              value: "/tmp/spire-agent/agent.sock"
          args:
            - /etc/zt-gateway/gateway.config.yaml
          ports:
            # proxy_addr (0.0.0.0:443): the only listener meant to be
            # reachable off-pod -- see the Service below. admin_addr
            # (127.0.0.1:6443) binds loopback-only inside the pod's network
            # namespace, so it's deliberately NOT declared here (declaring
            # it wouldn't make it reachable via the pod IP anyway, since
            # the process itself only binds 127.0.0.1) and has no Service.
            - containerPort: 443
          volumeMounts:
            - name: registry
              mountPath: /etc/zt-gateway/registry.yaml
              subPath: registry.yaml
            - name: gateway-config
              mountPath: /etc/zt-gateway/gateway.config.yaml
              subPath: gateway.config.yaml
            - name: ca-material
              mountPath: /etc/zt-gateway/ca
              readOnly: true
            # Option 1 JWKS (review 0002 F4/N7): only this gateway's own private
            # key, never the other gateways'.
            - name: signing-key
              mountPath: /etc/zt-gateway/keys
              readOnly: true
            - name: jwks
              mountPath: /etc/zt-gateway/jwks
              readOnly: true
            - name: idp-jwks
              mountPath: /etc/zt-gateway/idp
              readOnly: true
            - name: spire-agent-socket
              mountPath: /tmp/spire-agent
              readOnly: true
      volumes:
        - name: registry
          configMap:
            name: zt-registry
        - name: gateway-config
          configMap:
            name: zt-gateway-config-api-gateway
        # Task 14 (N13): shared mTLS trust root (deploy/k8s/zt-ca-secret.yaml)
        # -- same Secret mounted by orders-svc.yaml/inventory-svc.yaml, so
        # `ca.cert_path`/`ca.key_path` resolve to the same CA everywhere.
        - name: ca-material
          secret:
            secretName: zt-ca
        # Created by scripts/deploy-all.sh from deploy/k8s/keys/ (git-ignored).
        - name: signing-key
          secret:
            secretName: zt-signing-key-api-gateway
        # Public verification set, identical in all three gateways.
        - name: jwks
          configMap:
            name: zt-jwks
        # Agent demo: the mock IdP's public keys, created by scripts/deploy-all.sh.
        - name: idp-jwks
          configMap:
            name: zt-user-idp-jwks
        # From deploy/k8s/spire-agent.yaml's DaemonSet: that agent mounts
        # its Workload API socket at this same fixed hostPath, so any pod
        # on the same node (any namespace) can reach it this way.
        - name: spire-agent-socket
          hostPath:
            path: /tmp/spire-agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: zero-trust-demo
spec:
  selector:
    app: api-gateway
  ports:
    # Matches proxy_addr above -- admin_addr is loopback-only and has no
    # Service (see the containerPort comment above).
    - name: https
      port: 443
      targetPort: 443
