# inventory-svc: the "leaf" of the demo chain (api-gateway -> orders-svc ->
# inventory-svc). Same-pod topology (blueprint's Topology A): the backend
# binds to 127.0.0.1 only inside the pod's shared network namespace, so
# zt-gateway is the only thing reachable from the Service.
#
# Task 14 (N13): see api-gateway.yaml's comment for the `listen_addr` ->
# `proxy_addr`/`admin_addr` split rationale and the shared `zt-ca` mTLS
# trust root -- identical here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zt-gateway-config-inventory-svc
  namespace: zero-trust-demo
data:
  gateway.config.yaml: |
    proxy_addr: 0.0.0.0:443
    admin_addr: 127.0.0.1:6443
    upstream_addr: http://127.0.0.1:8080
    registry_path: /etc/zt-gateway/registry.yaml
    signing_key_path: /etc/zt-gateway/keys/signing-key.pem
    jwks_path: /etc/zt-gateway/jwks/public-jwks.json
    active_kid: inventory-svc
    # F14 / demo (docs/demo-obo-chain.md): /demo on this gateway's proxy is
    # answered by the standalone demo backend, not the embedded sidecar.
    # The route's workload_id is the authorization destination, so it must
    # be this gateway's own identity, the audience of the token it receives.
    # Design 0002: /demo rebinds the token to this workload's delegation cert and
    # forwards to the co-located sidecar, which exchanges it onward.
    delegation_cert_path: /etc/zt-gateway/delegation/cert.pem
    routes:
      - path_pattern: /demo
        workload_id: spiffe://chakra.internal/ns/inventory/sa/inventory-svc
        upstream_addr: http://127.0.0.1:8080
        delegate: true
        delegated_ttl_seconds: 60
    # Agent demo (review 0003 R8): trust the mock IdP for edge-minted user tokens.
    user_issuers:
      - http://localhost:18500/default
    user_idps:
      - issuer: http://localhost:18500/default
        jwks_path: /etc/zt-gateway/idp/idp-jwks.json
        audience: zt-gateway
        principal_claim: email
    # Capability policy (F11, R1/R4): default deny. The agent (orders-svc)
    # may GET /demo for a user only with that user's grant in the same rule.
    capability_policy_path: /etc/zt-gateway/policy/capability-policy.yaml
    protected_workload: spiffe://chakra.internal/ns/inventory/sa/inventory-svc
    token_ttl_seconds: 300
    tls:
      client_auth: required
    # R7 fix (review 0003): verify-only. Only api-gateway holds the CA private
    # key, so a compromise here can't mint X.509 SVIDs. Workloads get their SVIDs
    # from api-gateway's /v1/svid/x509.
    ca:
      cert_path: /etc/zt-gateway/ca/ca-cert.pem
      ttl_seconds: 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
  namespace: zero-trust-demo
  labels:
    app: inventory-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-svc
  template:
    metadata:
      labels:
        app: inventory-svc
    spec:
      containers:
        # Design 0002 demo backend: a co-located sidecar on loopback. It echoes the
        # token it was handed, so the demo can continue the chain from its response.
        # The demo stands in for the real workload.
        - name: backend
          image: python:3-alpine
          command: ["python3"]
          args:
            - -c
            - "import http.server, sys\nNAME = sys.argv[1]\nclass H(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n        token = self.headers.get(\"X-SPIFFE-OBO-Token\", \"\")\n        body = (\"hello from \" + NAME + \"\\ntoken: \" + token + \"\\n\").encode()\n        self.send_response(200)\n        self.send_header(\"content-length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *args):\n        pass\nhttp.server.ThreadingHTTPServer((\"127.0.0.1\", 8080), H).serve_forever()"
            - inventory-svc

        - name: zt-gateway
          image: zero-trust/zt-gateway:dev
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: RUST_LOG
              value: info
            # Task 6 (F13 part 2): see api-gateway.yaml for the full
            # rationale/caveat (this env var is currently inert; SPIRE
            # opt-in is via gateway.config.yaml's spire_socket_path).
            - name: ZT_SPIRE_SOCKET_PATH
              value: "/tmp/spire-agent/agent.sock"
          args:
            - /etc/zt-gateway/gateway.config.yaml
          ports:
            # See api-gateway.yaml's comment: only proxy_addr is declared
            # (admin_addr is loopback-only and has no Service).
            - containerPort: 443
          volumeMounts:
            - name: registry
              mountPath: /etc/zt-gateway/registry.yaml
              subPath: registry.yaml
            - name: gateway-config
              mountPath: /etc/zt-gateway/gateway.config.yaml
              subPath: gateway.config.yaml
            - name: ca-material
              mountPath: /etc/zt-gateway/ca
              readOnly: true
            # Option 1 JWKS (review 0002 F4/N7): only this gateway's own private
            # key, never the other gateways'.
            - name: signing-key
              mountPath: /etc/zt-gateway/keys
              readOnly: true
            - name: jwks
              mountPath: /etc/zt-gateway/jwks
              readOnly: true
            - name: delegation
              mountPath: /etc/zt-gateway/delegation
              readOnly: true
            - name: idp-jwks
              mountPath: /etc/zt-gateway/idp
              readOnly: true
            - name: capability-policy
              mountPath: /etc/zt-gateway/policy
              readOnly: true
            - name: spire-agent-socket
              mountPath: /tmp/spire-agent
              readOnly: true
      volumes:
        - name: registry
          configMap:
            name: zt-registry
        - name: gateway-config
          configMap:
            name: zt-gateway-config-inventory-svc
        # R7 fix: this pod gets the CA certificate only, never the private key.
        - name: ca-material
          secret:
            secretName: zt-ca
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
        # Created by scripts/deploy-all.sh from deploy/k8s/keys/ (git-ignored).
        - name: signing-key
          secret:
            secretName: zt-signing-key-inventory-svc
        # Public verification set, identical in all three gateways.
        - name: jwks
          configMap:
            name: zt-jwks
        # Design 0002: this workload's delegation certificate (cert only).
        - name: delegation
          secret:
            secretName: zt-delegation-inventory-svc
            items:
              - key: cert.pem
                path: cert.pem
        # Agent demo: the mock IdP's public keys, created by scripts/deploy-all.sh.
        - name: idp-jwks
          configMap:
            name: zt-user-idp-jwks
        - name: capability-policy
          configMap:
            name: zt-capability-policy
        - name: spire-agent-socket
          hostPath:
            path: /tmp/spire-agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-svc
  namespace: zero-trust-demo
spec:
  selector:
    app: inventory-svc
  ports:
    - name: https
      port: 443
      targetPort: 443
