[package]
name = "zero-trust"
version = "0.1.0"
edition = "2021"
description = "A zero-trust identity and OBO-delegation gateway/fabric service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/REPLACE_ME/zero-trust-rs"

[[bin]]
name = "zt-gateway"
path = "src/bin/zt-gateway.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
jsonwebtoken = "9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rsa = "0.9"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
time = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"
tower-http = { version = "0.6", features = ["trace"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
