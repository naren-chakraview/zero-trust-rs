name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (the SPIRE provider's tonic build needs it)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the gateway binary
        run: cargo build --release --locked --bin zt-gateway

      - name: Unit, integration and regression tests
        run: cargo test --locked --all-targets

      - name: Admin TLS tests (spawn the gateway binary; ignored by default)
        run: cargo test --release --locked --test admin_tls -- --ignored

  clippy:
    name: clippy (errors fail; warnings are reported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --locked --all-targets

  docker:
    name: container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image from the Dockerfile
        run: docker build -t zt-gateway:ci .
