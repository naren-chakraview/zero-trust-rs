# Jaeger all-in-one: accepts OTLP natively (both gRPC :4317 and HTTP :4318),
# bundled storage + UI (:16686). The lightest-weight trace backend for a
# local demo -- the blueprint's real stack is Tempo+Loki+Mimir+Grafana
# (ADR-0008), which is a lot more moving parts than this test needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: zero-trust-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: zero-trust-demo
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
