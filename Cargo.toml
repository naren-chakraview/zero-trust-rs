[package]
name = "zero-trust"
version = "0.4.3"
edition = "2021"
description = "A zero-trust identity and OBO-delegation gateway/fabric service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naren-chakraview/zero-trust-rs"

[[bin]]
name = "zt-gateway"
path = "src/bin/zt-gateway.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
jsonwebtoken = "9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rsa = "0.9"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
time = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
serde_json = "1"
tower = { version = "0.4", features = ["util", "limit", "buffer"] }
subtle = "2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
# Task 5 / F13: SPIRE Workload API `IdentityProvider` (`src/spire_provider.rs`).
#
# The plan called for `spiffe = "0.2"`, but that line of the crate (and
# everything through ~0.3.x) is built on `grpcio`, which needs `cmake` to
# compile its bundled gRPC C core -- not installed in this sandbox and not
# installable without root. `0.4.0` onward rewrote the Workload API client
# on top of `tonic` (pure Rust, only needs `protoc`, which *is* available
# here), so `0.18` (latest at the time of writing) is used instead. See
# `src/spire_provider.rs`'s module doc comment and the Task 5 report for
# the full tradeoff writeup.
spiffe = { version = "0.18", features = ["workload-api"] }

[dev-dependencies]
# Task 11 / N8: generates EC (P-256) test keypairs for ES256 coverage in
# `src/jwt.rs` and `src/spire_provider.rs` -- production code never needs
# this crate, since `jsonwebtoken::EncodingKey`/`DecodingKey` already know
# how to sign/verify ES256 once handed PEM/JWK material; this is only for
# *generating* that test-only material (SPIRE/real deployments hand over
# already-formed JWKS, never raw EC scalars).
p256 = { version = "0.13", features = ["jwk"] }
# F12 tests: `InMemorySpanExporter`, for asserting on recorded span
# attributes/status without a real OTLP collector.
opentelemetry_sdk = { version = "0.27", features = ["testing"] }
# F17: criterion benchmarks for the token-validation pipeline.
criterion = { version = "0.5", features = ["html_reports"] }
# Task 5 fix-round-1 regression test (`src/spire_provider.rs`): builds a
# `tonic::transport::Channel` directly via `connect_lazy()` so the test can
# construct a `WorkloadApiClient`/`SpireProvider` without any I/O at
# construction time (no live SPIRE agent needed), to exercise
# `issue_jwt_svid`'s sync/async bridge. Version pinned to match what
# `spiffe = "0.18"` already resolves to (see Cargo.lock) so the
# `tonic::transport::Channel` type here is the same type
# `WorkloadApiClient::new_with_channel` expects.
tonic = { version = "0.14", default-features = false, features = ["channel"] }

[[bench]]
name = "gateway_benches"
harness = false
