# Example zt-gateway config. Run from the repo root:
#   cargo run --bin zt-gateway -- examples/gateway.config.yaml
#
# This fronts inventory-svc (see tests/fixtures/registry.yaml) and forwards
# allowed requests to a backend app assumed to be listening on :8080.

listen_addr: 127.0.0.1:8443
upstream_addr: http://127.0.0.1:8080
registry_path: tests/fixtures/registry.yaml
protected_workload: spiffe://chakra.internal/ns/inventory/sa/inventory-svc

# signing_key_path: /path/to/private-key.pem
# When omitted, zt-gateway generates an ephemeral RSA keypair at startup —
# fine for trying this out, but issued tokens won't survive a restart.

token_ttl_seconds: 300
